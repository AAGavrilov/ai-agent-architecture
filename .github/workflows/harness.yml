name: Agent Architecture Harness

on:
  push:
  pull_request:

jobs:
  harness:
    name: Deterministic Harness
    # Пин вместо ubuntu-latest: предсказуемая среда без внезапной миграции образа.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        # actions/checkout@v7 (node24); fetch-depth: 0 обязателен для check-git-protocol
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run deterministic harness
        run: tests/harness/check-all.sh

      - name: Write harness result
        if: always()
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run=${GITHUB_RUN_ID}"
            echo "job=${GITHUB_JOB}"
          } > harness-result.txt

      - name: Upload harness result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-result
          path: harness-result.txt
